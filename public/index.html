<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meme-Galerie</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Meme-Galerie</h1>
    <input id="search" type="search" placeholder="Memes nach Namen suchen …" autocomplete="off" aria-label="Suche">
    <button id="open-upload" class="primary">+ Hochladen</button>
    <form method="post" action="/logout">
      <button type="submit" class="ghost">Abmelden</button>
    </form>
  </header>

  <main>
    <p id="status" class="muted"></p>
    <div id="gallery" class="gallery"></div>
  </main>

  <!-- Upload -->
  <dialog id="upload-dialog">
    <form id="upload-form">
      <h2>Meme hochladen</h2>
      <label class="dropzone" id="dropzone">
        <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
        <img id="preview" alt="" hidden>
        <span id="drop-hint">Bild hierher ziehen, klicken oder mit Strg+V einfügen</span>
      </label>
      <label>Name
        <input id="name" maxlength="120" required placeholder="z. B. Montagmorgen im Büro">
      </label>
      <p class="error" id="upload-error" hidden></p>
      <div class="actions">
        <button type="button" class="ghost" data-close>Abbrechen</button>
        <button type="submit" class="primary" id="upload-submit">Hochladen</button>
      </div>
    </form>
  </dialog>

  <!-- Detailansicht -->
  <dialog id="view-dialog" class="view">
    <img id="view-img" alt="">
    <form id="rename-form" class="rename">
      <input id="view-name" maxlength="120" required aria-label="Name">
      <button type="submit" class="primary">Speichern</button>
    </form>
    <div class="actions">
      <a id="view-download" class="button ghost" download>Herunterladen</a>
      <button type="button" class="danger" id="view-delete">Löschen</button>
      <button type="button" class="ghost" data-close>Schließen</button>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
